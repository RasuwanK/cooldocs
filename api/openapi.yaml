
openapi: 3.1.0

info:
  title: Cooldocs API
  version: 0.1.0
  description: Document database API for Cooldocs.

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cooldocs API is running
                  status:
                    type: string
                    example: ok

  /api/info:
    get:
      summary: Get API information
      operationId: getApiInfo
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Cooldocs
                  version:
                    type: string
                    example: 0.1.0

